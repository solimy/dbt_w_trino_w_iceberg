connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=mydata_dev
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/metastore_db
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=${ENV:PLATFORM_POSTGRES_SECRET}
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse-dev
iceberg.register-table-procedure.enabled=false
iceberg.add-files-procedure.enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://rustfs-dev:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=trino-dev
s3.aws-secret-key=${ENV:PLATFORM_STORAGE_DEV_SECRET}
