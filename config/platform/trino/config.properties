coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
http-server.process-forwarded=true
internal-communication.shared-secret=${ENV:PLATFORM_TRINO_INTERNAL_SECRET}
query.max-memory-per-node=512MB

http-server.authentication.type=oauth2
web-ui.authentication.type=oauth2
http-server.authentication.oauth2.issuer=${ENV:PLATFORM_ISSUER}
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=${ENV:PLATFORM_TRINO_SECRET}
http-server.authentication.oauth2.principal-field=preferred_username
http-server.authentication.oauth2.scopes=openid,profile,email
deprecated.http-server.authentication.oauth2.groups-field=groups
http-server.authentication.oauth2.oidc.discovery=false
http-server.authentication.oauth2.auth-url=${ENV:PLATFORM_ISSUER}/protocol/openid-connect/auth
http-server.authentication.oauth2.token-url=${ENV:PLATFORM_ISSUER}/protocol/openid-connect/token
http-server.authentication.oauth2.jwks-url=${ENV:PLATFORM_ISSUER}/protocol/openid-connect/certs
