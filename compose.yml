services:

  postgres:
    user: "${UID}:${GID}"
    image: postgres:13.16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: metastore_db
    volumes:
      - ${PWD}/rw_volumes/postgres_volume/:/var/lib/postgresql/data/
      - ${PWD}/config/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: rustfs-local
      RUSTFS_SECRET_KEY: rustfs-local-dev-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s


  rustfs_init:
    image: rustfs/rc:v0.1.37
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: rustfs-local
      RUSTFS_SECRET_KEY: rustfs-local-dev-secret
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}" --region us-east-1 --bucket-lookup path
        rc bucket create rustfs/warehouse --ignore-existing


  trino:
    image: trinodb/trino:463
    volumes:
      - ${PWD}/config/trino/start.sh:/usr/local/bin/start.sh
      - ${PWD}/config/trino/catalog/:/etc/trino/catalog/
      - ${PWD}/config/trino/config.properties:/etc/trino/config.properties
      - ${PWD}/config/trino/access-control.properties:/etc/trino/access-control.properties
      - ${PWD}/config/trino/log.properties:/etc/trino/log.properties
      - ${PWD}/rw_volumes/caddy_data/:/caddy_data/:ro
    environment:
      DEBUG: "true"
    depends_on:
      rustfs_init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      keycloak:
        condition: service_started
      opa:
        condition: service_started
      caddy:
        condition: service_started
    entrypoint: ["/bin/sh","-eu","/usr/local/bin/start.sh"]


  query-ui:
    build: ./build/trino-query-ui
    environment:
      TRINO_URL: https://trino.127.0.0.1.nip.io
    depends_on:
      - trino


  airbyte-destination:
    image: airbyte/destination-iceberg:0.2.2
    profiles: [airbyte]
    volumes:
      - ./airbyte:/local:ro
    depends_on:
      rustfs_init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    command: ["write", "--config", "/local/destination.json", "--catalog", "/local/catalog.json"]


  opa:
    image: openpolicyagent/opa:1.8.0-istio-static
    command: run --server --addr :8181 --set=decision_logs.console=true --watch /etc/opa/policies/
    volumes:
      - ${PWD}/config/opa/policies/:/etc/opa/policies/


  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: auth.127.0.0.1.nip.io
    command: [start-dev]
    volumes:
      - ${PWD}/rw_volumes/keycloak_data/:/opt/keycloak/data/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/Trino/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 12


  caddy:
    image: caddy:2.9
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${PWD}/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PWD}/rw_volumes/caddy_data/:/data/
      - ${PWD}/rw_volumes/caddy_config/:/config/
    networks:
      default:
        aliases:
          - auth.127.0.0.1.nip.io
          - trino.127.0.0.1.nip.io
          - query-ui.127.0.0.1.nip.io
          - rustfs.127.0.0.1.nip.io
          - console.rustfs.127.0.0.1.nip.io

volumes:
  rustfs_data:
